<!--
  BigTick — squad hero, default pose (stage 2, big=true is this character's own default,
  so shockwave rings + star badge are included). Not talking, not walking.
  Extracted from J:/ESL Website Project/esl-super-squad-v2/src/components/characters/movable/BigTickV2.tsx
  (source read-only, not modified). See _ReferenceSource/movable/BigTickV2.tsx for the full
  parametric source (stage variants, walk pose) and characterStyles.css for animations.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" overflow="visible">
  <style>
    .body.tick { fill: #6D4C41; }
    .eye { fill: #1A1A1A; }
    .leg { stroke: #4E342E; stroke-width: 4; stroke-linecap: round; }
    .antenna { stroke: #4E342E; stroke-width: 2.5; stroke-linecap: round; }
    .mouth { stroke: #1A1A1A; stroke-width: 2.5; stroke-linecap: round; }
  </style>

  <!-- Shockwave rings (big state stomp effect) -->
  <ellipse cx="100" cy="170" rx="52" ry="10" fill="none" stroke="#FCA5A5" stroke-width="2.5" class="ring" />
  <ellipse cx="100" cy="170" rx="68" ry="13" fill="none" stroke="#F87171" stroke-width="1.5" class="ring" />

  <!-- Left legs (4) -->
  <line x1="62" y1="75"  x2="28" y2="50"  class="leg" />
  <line x1="58" y1="95"  x2="20" y2="88"  class="leg" />
  <line x1="58" y1="112" x2="20" y2="116" class="leg" />
  <line x1="62" y1="128" x2="28" y2="150" class="leg" />

  <!-- Right legs (4) -->
  <line x1="138" y1="75"  x2="172" y2="50"  class="leg" />
  <line x1="142" y1="95"  x2="180" y2="88"  class="leg" />
  <line x1="142" y1="112" x2="180" y2="116" class="leg" />
  <line x1="138" y1="128" x2="172" y2="150" class="leg" />

  <!-- Antennae -->
  <line x1="90"  y1="62" x2="74" y2="42" class="antenna" />
  <circle cx="74" cy="42" r="5" fill="#6D4C41" />
  <line x1="110" y1="62" x2="126" y2="42" class="antenna" />
  <circle cx="126" cy="42" r="5" fill="#6D4C41" />

  <!-- Body -->
  <circle cx="100" cy="100" r="42" class="body tick" />
  <ellipse cx="88" cy="84" rx="20" ry="14" fill="#8D6E63" opacity="0.4" />

  <!-- Star badge (big state) -->
  <polygon
    points="100,76 103,84 111,84 105,89 107.5,97 100,92 92.5,97 95,89 89,84 97,84"
    fill="#FFD60A" stroke="#D97706" stroke-width="1.2" />

  <!-- Eyes -->
  <circle cx="88"  cy="92" r="9" class="eye" />
  <circle cx="112" cy="92" r="9" class="eye" />
  <circle cx="90"  cy="89" r="3" fill="white" />
  <circle cx="114" cy="89" r="3" fill="white" />

  <!-- Mouth (idle) -->
  <line x1="80" y1="116" x2="120" y2="116" class="mouth" />
</svg>
